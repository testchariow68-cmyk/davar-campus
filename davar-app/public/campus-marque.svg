<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 84 166 88" width="166" height="88" role="img" aria-label="DAVAR ACADEMIE CAMPUS">
  <!-- La marque seule, et rien autour. Le pavé violet et l'anneau d'or ont
       été retirés : il ne reste que le pupitre, posé à même le fond des pages
       d'authentification.

       Le cadre est serré au plus juste (il épouse la marque au lieu de la
       noyer dans un carré) : sans ce vide en dessous, le slogan peut venir
       se coller contre le logo, ainsi qu'on le veut.

       Le pavé reste en service pour le favicon, où un fond est indispensable
       (onglet du navigateur, écran d'accueil du téléphone). -->
  <g stroke="#D4AF37" stroke-width="6.7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M48 115.9 L120 92.4 L192 115.9 L120 140.7 Z" fill="#D4AF37" fill-opacity=".18"/>
    <path d="M82.6 139.9 L82.6 161.4 Q120 176.6 157.4 161.4 L157.4 139.9"/>
    <path d="M190.6 115.9 L190.6 149"/>
    <circle cx="190.6" cy="155.9" r="6.7" fill="#D4AF37" stroke="none"/>
  </g>
</svg>
