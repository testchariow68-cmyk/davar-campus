<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 200 200" width="200" height="200" role="img" aria-label="DAVAR ACADEMIE CAMPUS">
  <title>DAVAR ACADÉMIE CAMPUS — l'anneau seul, sans les écritures</title>
  <defs>
    <!-- Exactement le violet sombre du favicon (campus-icon.svg) : #241640 au
         centre, #150E24 au bord. Centre et rayon sont ceux du logo de
         l'animation d'ouverture, de sorte que l'anneau laisse voir la même
         portion de dégradé que le favicon. -->
    <radialGradient id="fond-anneau" gradientUnits="userSpaceOnUse"
                    cx="120" cy="92.7" r="245.8">
      <stop offset="0%" stop-color="#241640"/>
      <stop offset="100%" stop-color="#150E24"/>
    </radialGradient>
  </defs>

  <!-- Le fond de l'anneau, puis le trait d'or, puis la marque. Rien d'autre :
       ni nom, ni slogan. C'est le même dessin que l'animation d'ouverture,
       auquel on a seulement retiré les écritures. -->
  <circle cx="120" cy="120" r="96" fill="url(#fond-anneau)"/>
  <circle cx="120" cy="120" r="96" fill="none" stroke="#D4AF37" stroke-width="5.3"/>
  <g stroke="#D4AF37" stroke-width="6.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M48.0 115.9 L120.0 92.4 L192.0 115.9 L120.0 140.7 Z" fill="#D4AF37" fill-opacity=".16"/><path d="M82.6 139.9 L82.6 161.4 Q120.0 176.6 157.4 161.4 L157.4 139.9"/><path d="M190.6 115.9 L190.6 149.0"/><circle cx="190.6" cy="155.9" r="6.7" fill="#D4AF37" stroke="none"/></g>
</svg>
