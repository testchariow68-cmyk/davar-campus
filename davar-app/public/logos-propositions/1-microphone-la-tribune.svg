<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-labelledby="titre desc">
  <title id="titre">Proposition 1 — La Tribune — Davar Académie Campus</title>
  <desc id="desc">Un mortier d’or dans un pavé violet, prolongé par un microphone fin orienté vers le bas.</desc>
  <defs>
    <radialGradient id="tribune-fond" cx="36%" cy="30%" r="92%">
      <stop offset="0" stop-color="#2D1B4D"/>
      <stop offset="1" stop-color="#150E24"/>
    </radialGradient>
    <linearGradient id="tribune-or" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4E2A0"/>
      <stop offset=".5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#A8842A"/>
    </linearGradient>
    <filter id="tribune-ombre" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#080510" flood-opacity=".38"/>
    </filter>
    <g id="tribune-marque" stroke="url(#tribune-or)" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="120" cy="120" r="96" fill="none" stroke-width="5.4"/>
      <path d="M48 115.9 120 92.4l72 23.5-72 24.8-72-24.8Z" fill="#D4AF37" fill-opacity=".2" stroke-width="6.8"/>
      <path d="M82.6 139.9v21.5Q120 176.6 157.4 161.4v-21.5" fill="none" stroke-width="6.8"/>
      <!-- Microphone fin : sa capsule et sa grille descendent depuis la pointe du mortier. -->
      <path d="M190.7 115.9c7.2 1.9 11.9 6.8 12.9 13.5" fill="none" stroke-width="5.4"/>
      <path d="M203.8 127.1v25.4a8.2 8.2 0 0 0 16.4 0v-25.4a8.2 8.2 0 0 0-16.4 0Z" fill="#241640" stroke-width="5.4"/>
      <path d="M204.8 147.5h14.4M204.8 153.5h14.4M207 158.5h10" fill="none" stroke-width="2.8"/>
      <path d="M212 118.8v-7.2" fill="none" stroke-width="5.4"/>
    </g>
  </defs>

  <rect x="18" y="18" width="224" height="224" rx="48" fill="url(#tribune-fond)" stroke="#D4AF37" stroke-opacity=".24" stroke-width="1.5" filter="url(#tribune-ombre)"/>
  <use href="#tribune-marque" transform="translate(19 19) scale(.85)"/>

  <g transform="translate(286 0)">
    <text x="0" y="101" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700" letter-spacing="6" fill="url(#tribune-or)">DAVAR</text>
    <text x="3" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="400" letter-spacing="12" fill="#F3E9D2">ACADÉMIE</text>
    <line x1="4" y1="169" x2="382" y2="169" stroke="#D4AF37" stroke-width="2" stroke-opacity=".48"/>
    <text x="4" y="204" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" letter-spacing="14" fill="#8B5CF6">CAMPUS</text>
    <text x="4" y="232" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="3.5" fill="#A79FC0">LA PAROLE PREND FORME</text>
  </g>
</svg>
