<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-labelledby="titre description">
  <title id="titre">Proposition 4 — La Parole — Davar Académie</title>
  <desc id="description">Un microphone fin orienté vers le bas, au centre d'une bulle de parole et de deux ondes vocales.</desc>
  <defs>
    <linearGradient id="p4-violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="p4-or" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0D98A"/>
      <stop offset=".5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#A8842A"/>
    </linearGradient>
    <filter id="p4-ombre" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#150E24" flood-opacity=".2"/>
    </filter>
  </defs>
  <g transform="translate(24 24)" filter="url(#p4-ombre)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bulle de parole ouverte : une signature d'art oratoire, pas un simple cercle. -->
    <path d="M118 30c-52 0-94 35-94 79 0 29 19 54 48 68l-13 38 39-27c7 1 13 1 20 1 52 0 94-36 94-80s-42-79-94-79Z" fill="#150E24" stroke="url(#p4-or)" stroke-width="4"/>
    <!-- Microphone suspendu, tête/grille vers le bas. -->
    <path d="M118 63v30" stroke="url(#p4-or)" stroke-width="4"/>
    <path d="M92 93c0-16 11-29 26-29s26 13 26 29v46c0 16-11 29-26 29s-26-13-26-29V93Z" fill="url(#p4-violet)" stroke="url(#p4-or)" stroke-width="4"/>
    <path d="M100 116h36M99 128h38M101 140h34M105 151h26" stroke="#F6E6AA" stroke-width="3" opacity=".9"/>
    <path d="M77 121v16c0 25 18 43 41 43s41-18 41-43v-16" fill="none" stroke="url(#p4-or)" stroke-width="4"/>
    <path d="M118 180v20M96 200h44" stroke="url(#p4-or)" stroke-width="4"/>
    <!-- Ondes vocales réduites à deux gestes lisibles. -->
    <path d="M62 101c-9 10-14 22-14 35s5 25 14 35M174 101c9 10 14 22 14 35s-5 25-14 35" fill="none" stroke="#8B5CF6" stroke-width="4"/>
  </g>
  <g transform="translate(300 63)">
    <text x="0" y="54" fill="#D4AF37" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" letter-spacing="7">DAVAR</text>
    <text x="3" y="103" fill="#F3E9D2" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" letter-spacing="11">ACADÉMIE</text>
    <path d="M4 126h360" stroke="#D4AF37" stroke-width="2" opacity=".75"/>
    <text x="4" y="157" fill="#6D28D9" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="5">LA PAROLE PREND FORME</text>
  </g>
</svg>
