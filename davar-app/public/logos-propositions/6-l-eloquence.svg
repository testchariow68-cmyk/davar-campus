<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-labelledby="titre description">
  <title id="titre">Proposition 6 — L'Éloquence — Davar Académie</title>
  <desc id="description">Des guillemets ouverts encadrent un microphone orienté vers le bas et une onde de voix, symbole direct de l'art oratoire.</desc>
  <defs>
    <linearGradient id="p6-violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="p6-or" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7E7A7"/>
      <stop offset=".52" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#A8842A"/>
    </linearGradient>
  </defs>
  <g transform="translate(35 31)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Guillemets : le langage et la pensée avant le microphone. -->
    <path d="M42 66h35L54 104h22" fill="none" stroke="url(#p6-or)" stroke-width="8"/>
    <path d="M198 66h-35l23 38h-22" fill="none" stroke="url(#p6-or)" stroke-width="8"/>
    <!-- Capsule descendante au cœur de la marque. -->
    <path d="M120 63v24" stroke="url(#p6-or)" stroke-width="4"/>
    <path d="M99 87c0-15 9-26 21-26s21 11 21 26v45c0 15-9 26-21 26s-21-11-21-26V87Z" fill="url(#p6-violet)" stroke="url(#p6-or)" stroke-width="4"/>
    <path d="M106 107h28M105 119h30M107 131h26M111 142h18" stroke="#FFF0B9" stroke-width="3"/>
    <path d="M84 111v14c0 22 16 39 36 39s36-17 36-39v-14M120 164v19M101 183h38" fill="none" stroke="url(#p6-or)" stroke-width="4"/>
    <!-- Onde continue : une forme mémorisable en favicon comme en signature. -->
    <path d="M65 213c18 11 36 16 55 16s37-5 55-16" fill="none" stroke="#8B5CF6" stroke-width="5"/>
    <path d="M82 231c12 6 25 9 38 9s26-3 38-9" fill="none" stroke="#D4AF37" stroke-width="3"/>
    <circle cx="120" cy="229" r="4" fill="#D4AF37" stroke="none"/>
  </g>
  <g transform="translate(316 65)">
    <text x="0" y="52" fill="#D4AF37" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" letter-spacing="7">DAVAR</text>
    <text x="3" y="101" fill="#F3E9D2" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" letter-spacing="11">ACADÉMIE</text>
    <path d="M4 126h370" stroke="#D4AF37" stroke-width="2" opacity=".75"/>
    <text x="4" y="157" fill="#6D28D9" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="5">L'ART DE CONVAINCRE</text>
  </g>
</svg>
