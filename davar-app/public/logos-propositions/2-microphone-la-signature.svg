<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-labelledby="titre desc">
  <title id="titre">Proposition 2 — La Signature — Davar Académie Campus</title>
  <desc id="desc">Une marque aérée et sans pavé, avec un microphone doré orienté vers le bas dans la continuité du mortier.</desc>
  <defs>
    <linearGradient id="signature-or" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4E2A0"/>
      <stop offset=".5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#A8842A"/>
    </linearGradient>
    <linearGradient id="signature-violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
    <filter id="signature-ombre" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#130C20" flood-opacity=".2"/>
    </filter>
    <g id="signature-marque" stroke="url(#signature-or)" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="120" cy="120" r="96" fill="none" stroke-width="4.8"/>
      <path d="M48 115.9 120 92.4l72 23.5-72 24.8-72-24.8Z" fill="#D4AF37" fill-opacity=".14" stroke-width="6.4"/>
      <path d="M82.6 139.9v21.5Q120 176.6 157.4 161.4v-21.5" fill="none" stroke-width="6.4"/>
      <!-- Trait de liaison volontairement court : le microphone paraît suspendu à la marque. -->
      <path d="M190.7 115.9c7.2 1.9 11.9 6.8 12.9 13.5" fill="none" stroke-width="5.1"/>
      <path d="M203.8 127.1v25.4a8.2 8.2 0 0 0 16.4 0v-25.4a8.2 8.2 0 0 0-16.4 0Z" fill="#241640" stroke-width="5.1"/>
      <path d="M204.8 147.5h14.4M204.8 153.5h14.4M207 158.5h10" fill="none" stroke-width="2.7"/>
      <path d="M212 118.8v-7.2" fill="none" stroke-width="5.1"/>
    </g>
  </defs>

  <g transform="translate(15 20) scale(.87)" filter="url(#signature-ombre)">
    <use href="#signature-marque"/>
  </g>
  <path d="M36 226c60 18 151 18 214 0" fill="none" stroke="url(#signature-violet)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="30" cy="226" r="3.5" fill="#D4AF37"/>
  <circle cx="256" cy="226" r="3.5" fill="#D4AF37"/>

  <g transform="translate(322 0)">
    <text x="0" y="91" font-family="Georgia, 'Times New Roman', serif" font-size="65" font-weight="700" letter-spacing="6" fill="url(#signature-or)">DAVAR</text>
    <text x="3" y="137" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="400" letter-spacing="11" fill="#241640">ACADÉMIE</text>
    <text x="4" y="180" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" letter-spacing="13" fill="url(#signature-violet)">CAMPUS</text>
    <line x1="4" y1="202" x2="394" y2="202" stroke="#D4AF37" stroke-width="1.6" stroke-opacity=".68"/>
    <text x="4" y="227" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="3.1" fill="#6F6A80">L’ART DE LA PAROLE</text>
  </g>
</svg>
