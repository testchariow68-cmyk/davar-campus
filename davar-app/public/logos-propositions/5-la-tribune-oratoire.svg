<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-labelledby="titre description">
  <title id="titre">Proposition 5 — La Tribune — Davar Académie</title>
  <desc id="description">Une tribune stylisée, une onde de voix et un microphone orienté vers le bas, pour évoquer la prise de parole en public.</desc>
  <defs>
    <linearGradient id="p5-violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#241640"/>
    </linearGradient>
    <linearGradient id="p5-or" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4E2A0"/>
      <stop offset=".52" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#9E7B25"/>
    </linearGradient>
  </defs>
  <g transform="translate(32 33)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Une tribune : deux plans, une ligne de regard, une voix qui monte. -->
    <path d="M18 183h216M41 183l20-111h130l20 111M56 72h110l25 38H31L56 72Z" fill="#150E24" stroke="url(#p5-or)" stroke-width="4"/>
    <path d="M74 111h74M83 135h56M92 159h38" stroke="#8B5CF6" stroke-width="5"/>
    <!-- Microphone posé à la tribune, capsule vers le bas. -->
    <path d="M157 39v25" stroke="url(#p5-or)" stroke-width="4"/>
    <path d="M140 64c0-12 8-21 17-21s17 9 17 21v39c0 12-8 21-17 21s-17-9-17-21V64Z" fill="url(#p5-violet)" stroke="url(#p5-or)" stroke-width="4"/>
    <path d="M146 84h22M146 95h22M149 106h16" stroke="#F6E6AA" stroke-width="3"/>
    <path d="M128 92v13c0 18 13 31 29 31s29-13 29-31V92M157 136v20M142 156h30" fill="none" stroke="url(#p5-or)" stroke-width="4"/>
    <!-- Le trait d'onde fait passer le symbole de l'objet à la prise de parole. -->
    <path d="M22 48c26-20 54-20 80 0M18 27c35-27 71-27 106 0" fill="none" stroke="#8B5CF6" stroke-width="4"/>
    <circle cx="20" cy="48" r="4" fill="#D4AF37" stroke="none"/><circle cx="18" cy="27" r="4" fill="#D4AF37" stroke="none"/>
  </g>
  <g transform="translate(316 65)">
    <text x="0" y="52" fill="#D4AF37" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" letter-spacing="7">DAVAR</text>
    <text x="3" y="101" fill="#F3E9D2" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" letter-spacing="11">ACADÉMIE</text>
    <path d="M4 126h370" stroke="#6D28D9" stroke-width="2" opacity=".65"/>
    <text x="4" y="157" fill="#6D28D9" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="5">PRENDRE LA PAROLE</text>
  </g>
</svg>
