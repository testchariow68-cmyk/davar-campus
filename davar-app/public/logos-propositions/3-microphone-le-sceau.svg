<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-labelledby="titre desc">
  <title id="titre">Proposition 3 — Le Sceau — Davar Académie Campus</title>
  <desc id="desc">Un sceau d’académie violet et or qui réunit le mortier et un microphone fin orienté vers le bas.</desc>
  <defs>
    <radialGradient id="sceau-fond" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#2D1B4D"/>
      <stop offset="1" stop-color="#150E24"/>
    </radialGradient>
    <linearGradient id="sceau-or" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4E2A0"/>
      <stop offset=".5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#9E7B25"/>
    </linearGradient>
    <filter id="sceau-ombre" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#080510" flood-opacity=".34"/>
    </filter>
    <path id="sceau-haut" d="M72 120a74 74 0 0 1 148 0"/>
    <path id="sceau-bas" d="M220 120a74 74 0 0 1-148 0"/>
    <g id="sceau-marque" stroke="url(#sceau-or)" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="146" cy="120" r="101" fill="url(#sceau-fond)" stroke-width="3.6"/>
      <circle cx="146" cy="120" r="91" fill="none" stroke-width="1.3" stroke-opacity=".55"/>
      <path d="M80 115.9 146 94.4l66 21.5-66 22.8-66-22.8Z" fill="#D4AF37" fill-opacity=".2" stroke-width="6"/>
      <path d="M112 138.6v20.3q34 14.2 68 0v-20.3" fill="none" stroke-width="6"/>
      <!-- Le microphone descend depuis la pointe droite, comme un nouveau cordon de parole. -->
      <path d="M212 115.9c6.5 1.7 10.5 6 11.6 11.8" fill="none" stroke-width="4.8"/>
      <path d="M223.1 126.8v24.2a7.7 7.7 0 0 0 15.4 0v-24.2a7.7 7.7 0 0 0-15.4 0Z" fill="#241640" stroke-width="4.8"/>
      <path d="M224.1 146h13.4M224.1 151.6h13.4M226.2 156.5h9.2" fill="none" stroke-width="2.5"/>
      <path d="M230.8 119v-6.8" fill="none" stroke-width="4.8"/>
    </g>
  </defs>

  <g transform="translate(18 0)" filter="url(#sceau-ombre)">
    <use href="#sceau-marque"/>
    <text font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="800" letter-spacing="3.5" fill="#F3E9D2">
      <textPath href="#sceau-haut" startOffset="50%" text-anchor="middle">DAVAR ACADÉMIE</textPath>
    </text>
    <text font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="700" letter-spacing="4" fill="#8B5CF6">
      <textPath href="#sceau-bas" startOffset="50%" text-anchor="middle">CAMPUS · ORATOIRE</textPath>
    </text>
  </g>

  <g transform="translate(300 0)">
    <text x="0" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" letter-spacing="6" fill="url(#sceau-or)">DAVAR</text>
    <text x="3" y="142" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="400" letter-spacing="11" fill="#F3E9D2">ACADÉMIE</text>
    <rect x="3" y="166" width="280" height="31" rx="15.5" fill="url(#sceau-or)"/>
    <text x="143" y="187" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="800" letter-spacing="7" fill="#150E24">CAMPUS</text>
    <text x="4" y="225" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="3.3" fill="#A79FC0">LA VOIX, AVEC ÉLÉGANCE</text>
  </g>
</svg>
