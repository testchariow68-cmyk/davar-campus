<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 180" width="660" height="180" role="img" aria-label="Davar Académie Campus — modèle Le Sceau">
  <title>Modèle 4 — Le Sceau</title>
  <defs>
    <linearGradient id="c-or" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0D98A"/>
      <stop offset="52%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9E7B25"/>
    </linearGradient>
    <path id="c-arc-haut" d="M 14 90 A 76 76 0 0 1 166 90" fill="none"/>
    <g id="c-marque">
      <circle cx="120" cy="120" r="96" fill="none" stroke="#D4AF37" stroke-width="5.3"/>
      <g stroke="#D4AF37" stroke-width="6.7" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M48 115.9 L120 92.4 L192 115.9 L120 140.7 Z" fill="#D4AF37" fill-opacity=".18"/>
        <path d="M82.6 139.9 L82.6 161.4 Q120 176.6 157.4 161.4 L157.4 139.9"/>
        <path d="M190.6 115.9 L190.6 149"/>
        <circle cx="190.6" cy="155.9" r="6.7" fill="#D4AF37" stroke="none"/>
      </g>
    </g>
  </defs>

  <!-- Un sceau : le nom court le long de l'anneau, la marque trône au centre. -->
  <circle cx="90" cy="90" r="84" fill="#150E24" stroke="url(#c-or)" stroke-width="2.5"/>
  <circle cx="90" cy="90" r="76" fill="none" stroke="url(#c-or)" stroke-width="1" stroke-opacity=".5"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700"
        letter-spacing="3.4" fill="url(#c-or)">
    <textPath href="#c-arc-haut" startOffset="50%" text-anchor="middle">DAVAR ACADÉMIE</textPath>
  </text>
  <use href="#c-marque" transform="translate(35 38) scale(0.42)"/>
  <text x="90" y="152" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="13" font-weight="700" letter-spacing="6" fill="#8B5CF6">CAMPUS</text>

  <text x="206" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700"
        letter-spacing="5" fill="url(#c-or)">DAVAR</text>
  <text x="208" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="400"
        letter-spacing="10" fill="#F3E9D2">ACADÉMIE</text>
  <line x1="208" y1="128" x2="470" y2="128" stroke="#D4AF37" stroke-width="2" stroke-opacity=".5"/>
  <text x="208" y="152" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18"
        font-weight="600" letter-spacing="12" fill="#8B5CF6">CAMPUS</text>
</svg>
